name: Cezar command loop check

on:
  push:
    paths:
      - "cezar-command/**"
      - ".github/workflows/cezar-command-check.yml"
  pull_request:
    paths:
      - "cezar-command/**"
      - ".github/workflows/cezar-command-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile controller
        run: python -m py_compile cezar-command/command_loop.py cezar-command/test_command_loop.py
      - name: Run command loop tests
        run: python -m unittest cezar-command/test_command_loop.py
