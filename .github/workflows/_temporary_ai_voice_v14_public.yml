name: Temporary AI Voice v14 Public

on:
  push:
    branches:
      - chatgpt/ai-voice-v14-public

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-voice-v14-public
          fetch-depth: 0
      - name: Fetch private source files and build delta manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = "rensei11/05-AI-voice"
          ref = "9eb3d9759a10aa4a88f2cb51af61e717513cd4e8"
          version = "2026-10-07-v14"
          paths = ["app.py", "app_wuwa.py", "start_local.ps1", "sources/wuwa_local.py"]
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github.raw+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ai-voice-v14-release",
          }
          files = {}
          for path in paths:
              url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={ref}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  files[path] = response.read().decode("utf-8-sig")
          data = (json.dumps({"version": version, "files": files}, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
          output = Path("ai-voice/releases/2026-10-07-v14.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(data)
          Path("ai-voice/releases/2026-10-07-v14.sha256").write_text(hashlib.sha256(data).hexdigest() + "\n", encoding="ascii")
      - name: Commit public manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-voice/releases/2026-10-07-v14.json ai-voice/releases/2026-10-07-v14.sha256
          git commit -m "Publish AI voice 2026-10-07-v14 manifest"
          git push origin HEAD:chatgpt/ai-voice-v14-public
