name: Sync Fandom v77 package

on:
  push:
    paths:
      - .github/workflows/sync-fandom-v77.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch package
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          package = Path('fandom-voice-tool-latest.json')
          payload = json.loads(package.read_text(encoding='utf-8'))
          assert payload['version'] == '2026-09-24-v76'
          for name, patch_name in [
              ('app.py', '.sync-v77/app-1.patch'),
              ('acquisition_service.py', '.sync-v77/acquisition.patch'),
              ('app.py', '.sync-v77/app-2.patch'),
              ('app.py', '.sync-v77/app-3.patch'),
          ]:
              path = Path(name)
              path.write_text(payload['files'][name], encoding='utf-8')
              subprocess.run(['patch', '--batch', '--forward', name, patch_name], check=True)
              payload['files'][name] = path.read_text(encoding='utf-8')
              path.unlink()
          def blob_sha(text):
              data = text.encode('utf-8')
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob_sha(payload['files']['app.py']) == '8fc8c83db5b310b66d9b772607ad1f2a08ba22e3'
          assert blob_sha(payload['files']['acquisition_service.py']) == 'e09dbc9c1512d4666303872d9c49966eec7f7e71'
          payload['version'] = '2026-09-24-v77'
          package.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          check = json.loads(package.read_text(encoding='utf-8'))
          assert check['version'] == '2026-09-24-v77'
          for required in ('app.py','start_local.ps1','update_and_start.ps1','shared_results/paimon.json'):
              assert required in check['files']
          PY
      - name: Commit package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fandom-voice-tool-latest.json
          git commit -m "Sync Fandom voice tool package to v77"
          git push
