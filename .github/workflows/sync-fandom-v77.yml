          for name, diff in patches:
              path = Path(name)
              path.write_text(payload['files'][name], encoding='utf-8')
              patch = Path(name + '.patch')
              patch.write_text('--- ' + name + '\n+++ ' + name + '\n' + diff + '\n', encoding='utf-8')
              subprocess.run(['patch', '--batch', '--forward', name, str(patch)], check=True)
              payload['files'][name] = path.read_text(encoding='utf-8')
              path.unlink()
              patch.unlink()

          def blob_sha(text):
              data = text.encode('utf-8')
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          assert blob_sha(payload['files']['app.py']) == '8fc8c83db5b310b66d9b772607ad1f2a08ba22e3'
          assert blob_sha(payload['files']['acquisition_service.py']) == 'e09dbc9c1512d4666303872d9c49966eec7f7e71'
          payload['version'] = '2026-09-24-v77'
          package.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          check = json.loads(package.read_text(encoding='utf-8'))
          assert check['version'] == '2026-09-24-v77'
          assert 'start_local.ps1' in check['files']
          assert 'update_and_start.ps1' in check['files']
          assert 'shared_results/paimon.json' in check['files']
