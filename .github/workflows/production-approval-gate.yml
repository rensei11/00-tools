name: Production Approval Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  approval-gate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approval received
        run: echo "Production approval granted."

  updater-repair-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public updater repair
        shell: powershell
        run: |
          $cmdPath = 'repair-fandom-start.cmd'
          $updaterPath = 'ai-voice/bootstrap/v1/migrate_updater_bootstrap_v1.ps1'

          $cmdBytes = [IO.File]::ReadAllBytes($cmdPath)
          if (@($cmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'repair-fandom-start.cmd must remain ASCII-only.'
          }

          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $updaterPath),
              [ref]$tokens,
              [ref]$errors
          )
          if (@($errors).Count -ne 0) {
              throw ('public updater parse failed: ' + $errors[0].Message)
          }

          $phase2Cmd = (Get-ChildItem -LiteralPath 'ai-voice/phase2' -File -Filter '*.cmd' | Select-Object -First 1).FullName
          if ([string]::IsNullOrWhiteSpace($phase2Cmd)) { throw 'Yun Jin Phase2 CMD was not found.' }
          $phase2Ps1 = 'ai-voice/phase2/yunjin_phase2_flac_v1.ps1'

          $phase2CmdBytes = [IO.File]::ReadAllBytes($phase2Cmd)
          if (@($phase2CmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Yun Jin Phase2 CMD must remain ASCII-only.'
          }

          $phase2Ps1Bytes = [IO.File]::ReadAllBytes($phase2Ps1)
          if ($phase2Ps1Bytes.Length -lt 3 -or
              $phase2Ps1Bytes[0] -ne 0xEF -or
              $phase2Ps1Bytes[1] -ne 0xBB -or
              $phase2Ps1Bytes[2] -ne 0xBF) {
              throw 'Yun Jin Phase2 PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $phase2Tokens = $null
          $phase2Errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $phase2Ps1),
              [ref]$phase2Tokens,
              [ref]$phase2Errors
          )
          if (@($phase2Errors).Count -ne 0) {
              throw ('Yun Jin Phase2 PowerShell parse failed: ' + $phase2Errors[0].Message)
          }

          $phase2Text = [IO.File]::ReadAllText($phase2Ps1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'Direct production-root audit:',
              'Phase2 requires an existing reference and will not create or rebuild one.',
              'Live-app audit:',
              'The app and migration root disagree.',
              'PHASE2_YUNJIN=SUCCESS'
          )) {
              if (-not $phase2Text.Contains($required)) {
                  throw ('Yun Jin Phase2 guard is missing: ' + $required)
              }
          }

          $inventoryCmd = 'ai-voice/phase2/02_phase2_inventory.cmd'
          $inventoryPs1 = 'ai-voice/phase2/phase2_readonly_inventory_v1.ps1'

          $inventoryCmdBytes = [IO.File]::ReadAllBytes($inventoryCmd)
          if (@($inventoryCmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Phase2 inventory CMD must remain ASCII-only.'
          }

          $inventoryPs1Bytes = [IO.File]::ReadAllBytes($inventoryPs1)
          if ($inventoryPs1Bytes.Length -lt 3 -or
              $inventoryPs1Bytes[0] -ne 0xEF -or
              $inventoryPs1Bytes[1] -ne 0xBB -or
              $inventoryPs1Bytes[2] -ne 0xBF) {
              throw 'Phase2 inventory PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $inventoryTokens = $null
          $inventoryErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $inventoryPs1),
              [ref]$inventoryTokens,
              [ref]$inventoryErrors
          )
          if (@($inventoryErrors).Count -ne 0) {
              throw ('Phase2 inventory PowerShell parse failed: ' + $inventoryErrors[0].Message)
          }

          $inventoryText = [IO.File]::ReadAllText($inventoryPs1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'PHASE2_INVENTORY=START',
              'CLEAN_PILOT_CANDIDATE',
              'LEGACY_MIGRATION_CANDIDATE',
              'READ_ONLY_CONFIRMATION=No files were created, modified, moved, or deleted under the reference-audio root.',
              'PHASE2_INVENTORY=SUCCESS'
          )) {
              if (-not $inventoryText.Contains($required)) {
                  throw ('Phase2 inventory guard is missing: ' + $required)
              }
          }

          $legacyAuditCmd = 'ai-voice/phase2/03_phase2_legacy_dependency_audit.cmd'
          $legacyAuditPs1 = 'ai-voice/phase2/phase2_legacy_dependency_audit_v1.ps1'

          $legacyAuditCmdBytes = [IO.File]::ReadAllBytes($legacyAuditCmd)
          if (@($legacyAuditCmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Phase2 legacy audit CMD must remain ASCII-only.'
          }

          $legacyAuditPs1Bytes = [IO.File]::ReadAllBytes($legacyAuditPs1)
          if ($legacyAuditPs1Bytes.Length -lt 3 -or
              $legacyAuditPs1Bytes[0] -ne 0xEF -or
              $legacyAuditPs1Bytes[1] -ne 0xBB -or
              $legacyAuditPs1Bytes[2] -ne 0xBF) {
              throw 'Phase2 legacy audit PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $legacyAuditTokens = $null
          $legacyAuditErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $legacyAuditPs1),
              [ref]$legacyAuditTokens,
              [ref]$legacyAuditErrors
          )
          if (@($legacyAuditErrors).Count -ne 0) {
              throw ('Phase2 legacy audit PowerShell parse failed: ' + $legacyAuditErrors[0].Message)
          }

          $legacyAuditText = [IO.File]::ReadAllText($legacyAuditPs1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'PHASE2_LEGACY_AUDIT=START',
              'STANDARD_MANIFEST|',
              'EMOTION2VEC|',
              'READ_ONLY_CONFIRMATION=No files were created, modified, moved, renamed, or deleted.',
              'PHASE2_LEGACY_AUDIT=SUCCESS'
          )) {
              if (-not $legacyAuditText.Contains($required)) {
                  throw ('Phase2 legacy audit guard is missing: ' + $required)
              }
          }

          $franzCmd = 'ai-voice/phase2/04_franz_phase2_flac.cmd'
          $franzPs1 = 'ai-voice/phase2/franz_phase2_flac_v1.ps1'

          $franzCmdBytes = [IO.File]::ReadAllBytes($franzCmd)
          if (@($franzCmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Franz Phase2 CMD must remain ASCII-only.'
          }

          $franzPs1Bytes = [IO.File]::ReadAllBytes($franzPs1)
          if ($franzPs1Bytes.Length -lt 3 -or
              $franzPs1Bytes[0] -ne 0xEF -or
              $franzPs1Bytes[1] -ne 0xBB -or
              $franzPs1Bytes[2] -ne 0xBF) {
              throw 'Franz Phase2 PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $franzTokens = $null
          $franzErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $franzPs1),
              [ref]$franzTokens,
              [ref]$franzErrors
          )
          if (@($franzErrors).Count -ne 0) {
              throw ('Franz Phase2 PowerShell parse failed: ' + $franzErrors[0].Message)
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $franzZip = 'ai-voice/phase2/Phase2_Franz_FLAC.zip'
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $franzZip))
          try {
              $entries = @($zip.Entries)
              if ($entries.Count -ne 1 -or $entries[0].FullName -ne '04_franz_phase2_flac.cmd') {
                  throw 'Franz Phase2 ZIP contents are invalid.'
              }
              $stream = $entries[0].Open()
              $reader = $null
              try {
                  $reader = New-Object IO.StreamReader($stream, [Text.Encoding]::ASCII, $true)
                  $zipCmdText = $reader.ReadToEnd()
              }
              finally {
                  if ($reader) { $reader.Dispose() } else { $stream.Dispose() }
              }
              $diskCmdText = [IO.File]::ReadAllText($franzCmd, [Text.Encoding]::ASCII)
              $zipLines = @($zipCmdText -split '\r?\n')
              $diskLines = @($diskCmdText -split '\r?\n')
              if ($zipLines.Count -ne $diskLines.Count) {
                  throw 'Franz Phase2 ZIP CMD line count does not match the public CMD.'
              }
              for ($index = 0; $index -lt $zipLines.Count; $index++) {
                  if ($zipLines[$index] -cne $diskLines[$index]) {
                      throw ('Franz Phase2 ZIP CMD differs from the public CMD at line ' + ($index + 1))
                  }
              }
          }
          finally {
              $zip.Dispose()
          }
          $franzText = [IO.File]::ReadAllText($franzPs1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'Phase2 Franz legacy migration: START',
              '06b40de143f1f7d34d5157454651f02712b20d82',
              'wavCount -ne 20 -or $flacCount -ne 0',
              'def migrate_legacy_existing_wavs',
              'Migration committed:',
              'PHASE2_FRANZ=MIGRATED_VERIFICATION_FAILED',
              'PHASE2_FRANZ=SUCCESS'
          )) {
              if (-not $franzText.Contains($required)) {
                  throw ('Franz Phase2 guard is missing: ' + $required)
              }
          }

          $updater = [IO.File]::ReadAllText($updaterPath, [Text.Encoding]::UTF8)
          foreach ($required in @(
              '[switch]$RepairButton',
              '[switch]$ForceUpdate',
              '[string]$ToolRoot',
              'UPDATE_BUTTON_REPAIR=SUCCESS',
              'api.github.com/repos/rensei11/00-tools/contents/ai-voice/update-index.json?ref=main',
              'REPLACE_BEGIN relative=',
              'REPLACE_ERROR relative='
          )) {
              if (-not $updater.Contains($required)) {
                  throw ('public updater is missing: ' + $required)
              }
          }
          if ($updater.Contains('raw.githubusercontent.com/rensei11/05-AI-voice/')) {
              throw 'public updater contains a private raw URL.'
          }

          $sandbox = Join-Path $env:RUNNER_TEMP 'ai-voice-repair-test'
          New-Item -ItemType Directory -Path $sandbox -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $sandbox 'app.py') -Value 'APP_VERSION = "test"' -Encoding ASCII
          $appHashBefore = (Get-FileHash -LiteralPath (Join-Path $sandbox 'app.py') -Algorithm SHA256).Hash

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $updaterPath -RepairButton -ToolRoot $sandbox
          if ($LASTEXITCODE -ne 0) {
              throw ('repair mode failed with exit code ' + $LASTEXITCODE)
          }

          $installedPath = Join-Path $sandbox 'update_and_start.ps1'
          if (-not (Test-Path -LiteralPath $installedPath -PathType Leaf)) {
              throw 'repair mode did not create update_and_start.ps1.'
          }
          $installed = [IO.File]::ReadAllText($installedPath, [Text.Encoding]::UTF8)
          if (-not $installed.Contains('raw.githubusercontent.com/rensei11/00-tools/main/ai-voice/bootstrap/v1/migrate_updater_bootstrap_v1.ps1')) {
              throw 'installed update button does not use the public updater.'
          }
          if ($installed.Contains('raw.githubusercontent.com/rensei11/05-AI-voice/')) {
              throw 'installed update button contains a private raw URL.'
          }

          $appHashAfter = (Get-FileHash -LiteralPath (Join-Path $sandbox 'app.py') -Algorithm SHA256).Hash
          if ($appHashAfter -ne $appHashBefore) {
              throw 'repair mode modified app.py.'
          }
