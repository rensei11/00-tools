name: Black Codex Recovery Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "black-codex-recovery/**"
      - ".github/workflows/black-codex-recovery-check.yml"
  push:
    branches:
      - main
    paths:
      - "black-codex-recovery/**"
      - ".github/workflows/black-codex-recovery-check.yml"

permissions:
  contents: read

jobs:
  windows-static-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate recovery entrypoints
        shell: powershell
        run: |
          $cmdPath = 'black-codex-recovery/black_codex_recovery.cmd'
          $ps1Path = 'black-codex-recovery/run_black_codex.ps1'

          $cmd = [IO.File]::ReadAllText($cmdPath, [Text.Encoding]::ASCII)
          $cmdBytes = [IO.File]::ReadAllBytes($cmdPath)
          if (@($cmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Recovery CMD must remain ASCII-only.'
          }

          foreach ($forbidden in @('bash -lc', 'wsl.exe', 'mkdir -p', '$HOME', '$ROOT', '$REPO')) {
              if ($cmd.Contains($forbidden)) {
                  throw ('Recovery CMD contains duplicated WSL logic: ' + $forbidden)
              }
          }

          foreach ($required in @(
              'run_black_codex.ps1',
              'raw.githubusercontent.com/rensei11/00-tools/main/black-codex-recovery/run_black_codex.ps1',
              'powershell.exe -NoProfile -ExecutionPolicy Bypass -File',
              'Management.Automation.Language.Parser'
          )) {
              if (-not $cmd.Contains($required)) {
                  throw ('Recovery CMD is missing required canonical-runner handoff: ' + $required)
              }
          }

          $ps1 = [IO.File]::ReadAllText($ps1Path, [Text.Encoding]::UTF8)
          $ps1Bytes = [IO.File]::ReadAllBytes($ps1Path)
          if (@($ps1Bytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Recovery PowerShell must remain ASCII-only.'
          }

          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $ps1Path),
              [ref]$tokens,
              [ref]$errors
          )
          if (@($errors).Count -ne 0) {
              throw ('Recovery PowerShell parse failed: ' + $errors[0].Message)
          }

          foreach ($forbidden in @(
              '$HOME',
              '$ROOT',
              '$REPO',
              'bash -lc',
              'bash -s',
              'Invoke-WslChecked',
              'set -euo pipefail'
          )) {
              if ($ps1.Contains($forbidden)) {
                  throw ('Recovery PowerShell reintroduced a forbidden execution pattern: ' + $forbidden)
              }
          }

          if ($ps1.Contains("Invoke-WslCommand -Arguments 'codex --version'")) {
              throw 'Recovery PowerShell must not probe Codex outside the established login-environment runner.'
          }

          foreach ($required in @(
              'System.Diagnostics.ProcessStartInfo',
              'RedirectStandardInput',
              'StandardInput.BaseStream.Write',
              'ReadToEndAsync',
              'uname -s',
              'git --version',
              'python3 --version',
              '/home/rensei/codex-chase/05-AI-voice',
              'env GIT_TERMINAL_PROMPT=0 git',
              'rev-parse --verify origin/main',
              'inspect_update',
              'updater_candidate_test',
              'APP_VERSION_LOCAL',
              '_update_bootstrap_log.txt',
              'python3 - --control-repo',
              'Stopping stale managed bridge PID=',
              'ParseFile',
              'Black Codex recovery failed.'
          )) {
              if (-not $ps1.Contains($required)) {
                  throw ('Recovery PowerShell is missing required preflight: ' + $required)
              }
          }

      - name: Validate Windows PowerShell process API
        shell: powershell
        run: |
          $startInfo = New-Object System.Diagnostics.ProcessStartInfo
          $startInfo.FileName = 'powershell.exe'
          $startInfo.Arguments = '-NoProfile -Command "[Console]::In.ReadToEnd()"'
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.StandardOutputEncoding = New-Object Text.UTF8Encoding($false)
          $startInfo.StandardErrorEncoding = New-Object Text.UTF8Encoding($false)
          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $startInfo
          if (-not $process.Start()) {
              throw 'ProcessStartInfo could not start a child process.'
          }
          $stdoutTask = $process.StandardOutput.ReadToEndAsync()
          $stderrTask = $process.StandardError.ReadToEndAsync()
          $inputBytes = (New-Object Text.UTF8Encoding($false)).GetBytes("READY")
          $process.StandardInput.BaseStream.Write($inputBytes, 0, $inputBytes.Length)
          $process.StandardInput.BaseStream.Flush()
          $process.StandardInput.Close()
          $process.WaitForExit()
          $stdout = $stdoutTask.Result
          $stderr = $stderrTask.Result
          if ($process.ExitCode -ne 0 -or $stdout.Trim() -ne 'READY') {
              throw ('Windows PowerShell redirected-process API failed. ' + $stderr)
          }
