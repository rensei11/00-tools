name: Sync Fandom v77 package

on:
  push:
    paths:
      - .github/workflows/sync-fandom-v77.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v76 package to exact v77 files
