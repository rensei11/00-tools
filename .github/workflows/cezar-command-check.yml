name: Cezar command loop check

on:
  push:
    paths:
      - "cezar-command/**"
      - "cezar-command-center.cmd"
      - ".github/workflows/cezar-command-check.yml"
  pull_request:
    paths:
      - "cezar-command/**"
      - "cezar-command-center.cmd"
      - ".github/workflows/cezar-command-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile controllers
        run: |
          python -m py_compile \
            cezar-command/command_loop.py \
            cezar-command/dispatch.py \
            cezar-command/bootstrap_local.py \
            cezar-command/watch_task.py \
            cezar-command/cezar_smoke_test.py \
            cezar-command/test_command_loop.py
      - name: Run command loop tests
        run: python -m unittest cezar-command/test_command_loop.py
      - name: Prove managed Node bootstrap from an empty folder
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path("cezar-command").resolve()))
          import bootstrap_local as bootstrap

          with tempfile.TemporaryDirectory(prefix="managed-node-proof-") as raw:
              root = Path(raw)
              node_root = bootstrap.ensure_managed_node(root)
              bootstrap.apply_managed_node(node_root)
              node = node_root / "bin" / "node"
              npm = node_root / "bin" / "npm"
              node_version = bootstrap.run([str(node), "--version"]).stdout.strip()
              npm_version = bootstrap.run([str(npm), "--version"]).stdout.strip()
              if not node_version.startswith("v22.23.2"):
                  raise SystemExit(f"unexpected managed Node version: {node_version}")
              if not npm_version:
                  raise SystemExit("managed npm returned no version")
              print(f"managed Node: {node_version}")
              print(f"managed npm: {npm_version}")
          PY
      - name: Install exact Cezar runtime
        run: npm install --prefix .cezar-smoke --no-audit --no-fund @open-mercato/cezar@0.13.0
      - name: Run exact Cezar API smoke test
        run: python cezar-command/cezar_smoke_test.py --cezar-bin .cezar-smoke/node_modules/.bin/cezar
      - name: Verify bootstrap has no GitHub CLI dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("cezar-command/bootstrap_local.py").read_text(encoding="utf-8")
          if 'command("gh")' in text or "ensure_trigger_label" in text or "ensure_automation" in text:
              raise SystemExit("legacy GitHub CLI automation path is still present")
          print("bootstrap dependency check: OK")
          PY
      - name: Verify Windows launcher files are ASCII
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path("cezar-command-center.cmd"),
              Path("cezar-command/start_cezar_command_center.ps1"),
          ]
          for path in files:
              data = path.read_bytes()
              bad = [b for b in data if b > 0x7F]
              if bad:
                  raise SystemExit(f"{path} contains non-ASCII bytes")
              print(f"{path}: ASCII OK")
          PY

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "cezar-command/start_cezar_command_center.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "Windows PowerShell 5.1 parse: OK"
      - name: Prove harmless native stderr does not abort launcher logic
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $output = & cmd.exe /d /c "echo harmless-progress 1>&2 & exit /b 0" 2>&1
            $rc = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $previous
          }
          if ($rc -ne 0) {
            throw "Native stderr probe returned exit code $rc"
          }
          if ((@($output) -join [Environment]::NewLine) -notmatch 'harmless-progress') {
            throw "Native stderr probe output was not captured"
          }
          Write-Host "Native stderr handling: OK"
      - name: Verify launcher ASCII on Windows
        shell: powershell
        run: |
          $files = @(
            "cezar-command-center.cmd",
            "cezar-command/start_cezar_command_center.ps1"
          )
          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $file))
            if (($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$file contains non-ASCII bytes"
            }
          }
          Write-Host "Windows launcher ASCII: OK"
