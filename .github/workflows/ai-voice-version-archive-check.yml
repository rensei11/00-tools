name: AI Voice Version Archive Check

on:
  pull_request:
    paths:
      - 'ai-voice/bootstrap/v1/version_archive_manager.py'
      - 'ai-voice/bootstrap/v1/Voice-Version-Archive.cmd'
      - 'ai-voice/bootstrap/v1/migrate_updater_bootstrap_v1.ps1'
      - 'ai-voice/bootstrap/v1/test_version_archive_manager.py'
      - '.github/workflows/ai-voice-version-archive-check.yml'

jobs:
  isolated-windows-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell 5.1 parser and file encodings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'ai-voice/bootstrap/v1'
          $ps1 = Join-Path $dir 'migrate_updater_bootstrap_v1.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($ps1)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
            throw 'Updater PS1 is not UTF-8 BOM.'
          }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($ps1, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw ('PowerShell 5.1 parse failed: ' + $errors[0].Message) }
          $cmd = Join-Path $dir 'Voice-Version-Archive.cmd'
          foreach ($b in [System.IO.File]::ReadAllBytes($cmd)) {
            if ($b -gt 127) { throw 'Archive launcher must be ASCII only.' }
          }
      - name: Run isolated Python archive and restore preparation tests
        shell: pwsh
        run: |
          python -m unittest discover -s ai-voice/bootstrap/v1 -p test_version_archive_manager.py -v
      - name: Archive every currently published version in an isolated Windows folder
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'ai-voice-version-fixture'
          New-Item -Path $fixture -ItemType Directory -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $fixture 'app.py') -Value "APP_VERSION = 'v2.31'" -Encoding UTF8
          python ai-voice/bootstrap/v1/version_archive_manager.py archive --tool-root $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Published version archiving failed.' }
          python ai-voice/bootstrap/v1/version_archive_manager.py list --tool-root $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Saved version verification failed.' }
          python ai-voice/bootstrap/v1/version_archive_manager.py preview --tool-root $fixture --version v2.30
          if ($LASTEXITCODE -ne 0) { throw 'Archived release preview failed.' }
