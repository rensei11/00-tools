name: Temporary AI Voice WuWa NPC Hotfix

on:
  push:
    branches:
      - chatgpt/ai-voice-v14-public

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-voice-v14-public
          fetch-depth: 0
      - name: Build v13 WuWa NPC hotfix manifest
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          version = "2026-10-02-v13"
          staging = Path("ai-voice/staging/wuwa-npc-hotfix")
          files = {
              "app_wuwa.py": (staging / "app_wuwa.py").read_text(encoding="utf-8-sig"),
              "start_local.ps1": (staging / "start_local.ps1").read_text(encoding="utf-8-sig"),
              "sources/wuwa_local.py": (staging / "sources/wuwa_local.py").read_text(encoding="utf-8-sig"),
          }
          data = (json.dumps({"version": version, "files": files}, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
          out = Path("ai-voice/releases/2026-10-02-v13-wuwa-npc-hotfix.json")
          out.write_bytes(data)
          Path("ai-voice/releases/2026-10-02-v13-wuwa-npc-hotfix.sha256").write_text(
              hashlib.sha256(data).hexdigest() + "\n", encoding="ascii"
          )
      - name: Commit hotfix manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-voice/releases/2026-10-02-v13-wuwa-npc-hotfix.json ai-voice/releases/2026-10-02-v13-wuwa-npc-hotfix.sha256
          git commit -m "Publish AI voice v13 WuWa NPC hotfix manifest"
          git push origin HEAD:chatgpt/ai-voice-v14-public
