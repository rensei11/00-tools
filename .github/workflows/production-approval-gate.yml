name: Production Approval Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  approval-gate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approval received
        run: echo "Production approval granted."

  updater-repair-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate public updater repair
        shell: powershell
        run: |
          $cmdPath = 'repair-fandom-start.cmd'
          $updaterPath = 'ai-voice/bootstrap/v1/migrate_updater_bootstrap_v1.ps1'

          $cmdBytes = [IO.File]::ReadAllBytes($cmdPath)
          if (@($cmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'repair-fandom-start.cmd must remain ASCII-only.'
          }

          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $updaterPath),
              [ref]$tokens,
              [ref]$errors
          )
          if (@($errors).Count -ne 0) {
              throw ('public updater parse failed: ' + $errors[0].Message)
          }

          $phase2Cmd = (Get-ChildItem -LiteralPath 'ai-voice/phase2' -File -Filter '*.cmd' | Select-Object -First 1).FullName
          if ([string]::IsNullOrWhiteSpace($phase2Cmd)) { throw 'Yun Jin Phase2 CMD was not found.' }
          $phase2Ps1 = 'ai-voice/phase2/yunjin_phase2_flac_v1.ps1'

          $phase2CmdBytes = [IO.File]::ReadAllBytes($phase2Cmd)
          if (@($phase2CmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Yun Jin Phase2 CMD must remain ASCII-only.'
          }

          $phase2Ps1Bytes = [IO.File]::ReadAllBytes($phase2Ps1)
          if ($phase2Ps1Bytes.Length -lt 3 -or
              $phase2Ps1Bytes[0] -ne 0xEF -or
              $phase2Ps1Bytes[1] -ne 0xBB -or
              $phase2Ps1Bytes[2] -ne 0xBF) {
              throw 'Yun Jin Phase2 PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $phase2Tokens = $null
          $phase2Errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $phase2Ps1),
              [ref]$phase2Tokens,
              [ref]$phase2Errors
          )
          if (@($phase2Errors).Count -ne 0) {
              throw ('Yun Jin Phase2 PowerShell parse failed: ' + $phase2Errors[0].Message)
          }

          $phase2Text = [IO.File]::ReadAllText($phase2Ps1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'Direct production-root audit:',
              'Phase2 requires an existing reference and will not create or rebuild one.',
              'Live-app audit:',
              'The app and migration root disagree.',
              'PHASE2_YUNJIN=SUCCESS'
          )) {
              if (-not $phase2Text.Contains($required)) {
                  throw ('Yun Jin Phase2 guard is missing: ' + $required)
              }
          }

          $inventoryCmd = 'ai-voice/phase2/02_phase2_inventory.cmd'
          $inventoryPs1 = 'ai-voice/phase2/phase2_readonly_inventory_v1.ps1'

          $inventoryCmdBytes = [IO.File]::ReadAllBytes($inventoryCmd)
          if (@($inventoryCmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Phase2 inventory CMD must remain ASCII-only.'
          }

          $inventoryPs1Bytes = [IO.File]::ReadAllBytes($inventoryPs1)
          if ($inventoryPs1Bytes.Length -lt 3 -or
              $inventoryPs1Bytes[0] -ne 0xEF -or
              $inventoryPs1Bytes[1] -ne 0xBB -or
              $inventoryPs1Bytes[2] -ne 0xBF) {
              throw 'Phase2 inventory PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $inventoryTokens = $null
          $inventoryErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $inventoryPs1),
              [ref]$inventoryTokens,
              [ref]$inventoryErrors
          )
          if (@($inventoryErrors).Count -ne 0) {
              throw ('Phase2 inventory PowerShell parse failed: ' + $inventoryErrors[0].Message)
          }

          $inventoryText = [IO.File]::ReadAllText($inventoryPs1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'PHASE2_INVENTORY=START',
              'CLEAN_PILOT_CANDIDATE',
              'LEGACY_MIGRATION_CANDIDATE',
              'READ_ONLY_CONFIRMATION=No files were created, modified, moved, or deleted under the reference-audio root.',
              'PHASE2_INVENTORY=SUCCESS'
          )) {
              if (-not $inventoryText.Contains($required)) {
                  throw ('Phase2 inventory guard is missing: ' + $required)
              }
          }

          $legacyAuditCmd = 'ai-voice/phase2/03_phase2_legacy_dependency_audit.cmd'
          $legacyAuditPs1 = 'ai-voice/phase2/phase2_legacy_dependency_audit_v1.ps1'

          $legacyAuditCmdBytes = [IO.File]::ReadAllBytes($legacyAuditCmd)
          if (@($legacyAuditCmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Phase2 legacy audit CMD must remain ASCII-only.'
          }

          $legacyAuditPs1Bytes = [IO.File]::ReadAllBytes($legacyAuditPs1)
          if ($legacyAuditPs1Bytes.Length -lt 3 -or
              $legacyAuditPs1Bytes[0] -ne 0xEF -or
              $legacyAuditPs1Bytes[1] -ne 0xBB -or
              $legacyAuditPs1Bytes[2] -ne 0xBF) {
              throw 'Phase2 legacy audit PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $legacyAuditTokens = $null
          $legacyAuditErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $legacyAuditPs1),
              [ref]$legacyAuditTokens,
              [ref]$legacyAuditErrors
          )
          if (@($legacyAuditErrors).Count -ne 0) {
              throw ('Phase2 legacy audit PowerShell parse failed: ' + $legacyAuditErrors[0].Message)
          }

          $legacyAuditText = [IO.File]::ReadAllText($legacyAuditPs1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'PHASE2_LEGACY_AUDIT=START',
              'STANDARD_MANIFEST|',
              'EMOTION2VEC|',
              'READ_ONLY_CONFIRMATION=No files were created, modified, moved, renamed, or deleted.',
              'PHASE2_LEGACY_AUDIT=SUCCESS'
          )) {
              if (-not $legacyAuditText.Contains($required)) {
                  throw ('Phase2 legacy audit guard is missing: ' + $required)
              }
          }

          $franzCmd = 'ai-voice/phase2/04_franz_phase2_flac.cmd'
          $franzPs1 = 'ai-voice/phase2/franz_phase2_flac_v1.ps1'
          $franzHelper = 'ai-voice/phase2/franz_phase2_migrate_v1.py'
          $franzZip = 'ai-voice/phase2/Phase2_Franz_FLAC.zip'

          $franzCmdBytes = [IO.File]::ReadAllBytes($franzCmd)
          if (@($franzCmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Franz Phase2 CMD must remain ASCII-only.'
          }

          $franzPs1Bytes = [IO.File]::ReadAllBytes($franzPs1)
          if ($franzPs1Bytes.Length -lt 3 -or
              $franzPs1Bytes[0] -ne 0xEF -or
              $franzPs1Bytes[1] -ne 0xBB -or
              $franzPs1Bytes[2] -ne 0xBF) {
              throw 'Franz Phase2 PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $franzTokens = $null
          $franzErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $franzPs1),
              [ref]$franzTokens,
              [ref]$franzErrors
          )
          if (@($franzErrors).Count -ne 0) {
              throw ('Franz Phase2 PowerShell parse failed: ' + $franzErrors[0].Message)
          }

          python -m py_compile $franzHelper
          if ($LASTEXITCODE -ne 0) {
              throw ('Franz Phase2 helper compile failed with exit code ' + $LASTEXITCODE)
          }
          $helperSelfTest = @(& python $franzHelper --self-test 2>&1)
          if ($LASTEXITCODE -ne 0 -or (@($helperSelfTest | ForEach-Object { [string]$_ }) -notcontains 'FRANZ_PHASE2_SELF_TEST=PASS')) {
              throw ('Franz Phase2 helper self-test failed: ' + ((@($helperSelfTest | ForEach-Object { [string]$_ })) -join ' / '))
          }

          $franzText = [IO.File]::ReadAllText($franzPs1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'param([switch]$PackageSelfTest)',
              '$PSScriptRoot',
              'franz_phase2_migrate_v1.py',
              'wavCount -ne 20 -or $flacCount -ne 0',
              'wslpath -a -u $helperWin',
              'Migration committed:',
              'PHASE2_FRANZ=MIGRATED_VERIFICATION_FAILED',
              'PHASE2_FRANZ=SUCCESS'
          )) {
              if (-not $franzText.Contains($required)) {
                  throw ('Franz Phase2 guard is missing: ' + $required)
              }
          }
          if ($franzText.Contains('Invoke-WebRequest') -or
              $franzText.Contains('raw.githubusercontent.com') -or
              $franzText.Contains('StandardInput')) {
              throw 'Franz Phase2 PS1 must not use runtime download or stdin helper transport.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $franzZip))
          try {
              $entryNames = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
              $expectedNames = @(
                  '04_franz_phase2_flac.cmd',
                  'franz_phase2_flac_v1.ps1',
                  'franz_phase2_migrate_v1.py'
              ) | Sort-Object
              if ($entryNames.Count -ne $expectedNames.Count) {
                  throw 'Franz Phase2 ZIP entry count is invalid.'
              }
              for ($index = 0; $index -lt $expectedNames.Count; $index++) {
                  if ($entryNames[$index] -cne $expectedNames[$index]) {
                      throw ('Franz Phase2 ZIP entry mismatch: ' + $entryNames[$index])
                  }
              }
          }
          finally {
              $zip.Dispose()
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'franz-phase2-package'
          Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $franzZip), $extractRoot)

          foreach ($name in @(
              '04_franz_phase2_flac.cmd',
              'franz_phase2_flac_v1.ps1',
              'franz_phase2_migrate_v1.py'
          )) {
              if (-not (Test-Path -LiteralPath (Join-Path $extractRoot $name) -PathType Leaf)) {
                  throw ('Franz Phase2 ZIP extraction is missing: ' + $name)
              }
          }

          $env:FRANZ_PHASE2_PACKAGE_SELF_TEST = '1'
          try {
              & (Join-Path $extractRoot '04_franz_phase2_flac.cmd')
              if ($LASTEXITCODE -ne 0) {
                  throw ('Franz Phase2 packaged CMD self-test failed with exit code ' + $LASTEXITCODE)
              }
          }
          finally {
              Remove-Item Env:FRANZ_PHASE2_PACKAGE_SELF_TEST -ErrorAction SilentlyContinue
          }

          $packageLog = Join-Path $env:TEMP 'rensei_franz_phase2_flac_log.txt'
          if (-not (Test-Path -LiteralPath $packageLog -PathType Leaf)) {
              throw 'Franz Phase2 packaged CMD self-test did not create its log.'
          }
          $packageLogText = [IO.File]::ReadAllText($packageLog, [Text.Encoding]::UTF8)
          if (-not $packageLogText.Contains('FRANZ_PHASE2_PACKAGE_SELF_TEST=PASS')) {
              throw 'Franz Phase2 packaged CMD self-test did not report PASS.'
          }

          $merylCmd = 'ai-voice/phase2/05_meryl_phase2_flac.cmd'
          $merylPs1 = 'ai-voice/phase2/meryl_phase2_flac_v1.ps1'
          $merylHelper = 'ai-voice/phase2/meryl_phase2_migrate_v1.py'
          $merylZip = 'ai-voice/phase2/Phase2_Meryl_FLAC.zip'

          $merylCmdBytes = [IO.File]::ReadAllBytes($merylCmd)
          if (@($merylCmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Meryl Phase2 CMD must remain ASCII-only.'
          }

          $merylPs1Bytes = [IO.File]::ReadAllBytes($merylPs1)
          if ($merylPs1Bytes.Length -lt 3 -or
              $merylPs1Bytes[0] -ne 0xEF -or
              $merylPs1Bytes[1] -ne 0xBB -or
              $merylPs1Bytes[2] -ne 0xBF) {
              throw 'Meryl Phase2 PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $merylTokens = $null
          $merylErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $merylPs1),
              [ref]$merylTokens,
              [ref]$merylErrors
          )
          if (@($merylErrors).Count -ne 0) {
              throw ('Meryl Phase2 PowerShell parse failed: ' + $merylErrors[0].Message)
          }

          python -m py_compile $merylHelper
          if ($LASTEXITCODE -ne 0) {
              throw ('Meryl Phase2 helper compile failed with exit code ' + $LASTEXITCODE)
          }
          $merylHelperTest = @(& python $merylHelper --self-test 2>&1)
          if ($LASTEXITCODE -ne 0 -or (@($merylHelperTest | ForEach-Object { [string]$_ }) -notcontains 'MERYL_PHASE2_SELF_TEST=PASS')) {
              throw ('Meryl Phase2 helper self-test failed: ' + ((@($merylHelperTest | ForEach-Object { [string]$_ })) -join ' / '))
          }

          $merylText = [IO.File]::ReadAllText($merylPs1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'param([switch]$PackageSelfTest)',
              '$PSScriptRoot',
              'meryl_phase2_migrate_v1.py',
              'wavCount -ne 46 -or $flacCount -ne 0',
              'wslpath -a -u $helperWin',
              'Migration committed:',
              'PHASE2_MERYL=MIGRATED_VERIFICATION_FAILED',
              'PHASE2_MERYL=SUCCESS'
          )) {
              if (-not $merylText.Contains($required)) {
                  throw ('Meryl Phase2 guard is missing: ' + $required)
              }
          }
          if ($merylText.Contains('Invoke-WebRequest') -or
              $merylText.Contains('raw.githubusercontent.com') -or
              $merylText.Contains('StandardInput')) {
              throw 'Meryl Phase2 PS1 must not use runtime download or stdin helper transport.'
          }

          $merylHelperText = [IO.File]::ReadAllText($merylHelper, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'EXPECTED_WAV_COUNT = 46',
              'EXPECTED_STANDARD_REF_COUNT = 29',
              'EXPECTED_EMOTION_CACHE_COUNT = 29',
              '"gentle.json": 23',
              '"surprised.json": 19',
              'MERYL_PHASE2_SELF_TEST=PASS'
          )) {
              if (-not $merylHelperText.Contains($required)) {
                  throw ('Meryl Phase2 helper guard is missing: ' + $required)
              }
          }

          $merylZipHandle = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $merylZip))
          try {
              $entryNames = @($merylZipHandle.Entries | ForEach-Object { $_.FullName } | Sort-Object)
              $expectedNames = @(
                  '05_meryl_phase2_flac.cmd',
                  'meryl_phase2_flac_v1.ps1',
                  'meryl_phase2_migrate_v1.py'
              ) | Sort-Object
              if ($entryNames.Count -ne $expectedNames.Count) {
                  throw 'Meryl Phase2 ZIP entry count is invalid.'
              }
              for ($index = 0; $index -lt $expectedNames.Count; $index++) {
                  if ($entryNames[$index] -cne $expectedNames[$index]) {
                      throw ('Meryl Phase2 ZIP entry mismatch: ' + $entryNames[$index])
                  }
              }
          }
          finally {
              $merylZipHandle.Dispose()
          }

          $merylExtractRoot = Join-Path $env:RUNNER_TEMP 'meryl-phase2-package'
          Remove-Item -LiteralPath $merylExtractRoot -Recurse -Force -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $merylZip), $merylExtractRoot)

          $env:MERYL_PHASE2_PACKAGE_SELF_TEST = '1'
          try {
              & (Join-Path $merylExtractRoot '05_meryl_phase2_flac.cmd')
              if ($LASTEXITCODE -ne 0) {
                  throw ('Meryl Phase2 packaged CMD self-test failed with exit code ' + $LASTEXITCODE)
              }
          }
          finally {
              Remove-Item Env:MERYL_PHASE2_PACKAGE_SELF_TEST -ErrorAction SilentlyContinue
          }

          $merylPackageLog = Join-Path $env:TEMP 'rensei_meryl_phase2_flac_log.txt'
          if (-not (Test-Path -LiteralPath $merylPackageLog -PathType Leaf)) {
              throw 'Meryl Phase2 packaged CMD self-test did not create its log.'
          }
          $merylPackageLogText = [IO.File]::ReadAllText($merylPackageLog, [Text.Encoding]::UTF8)
          if (-not $merylPackageLogText.Contains('MERYL_PHASE2_PACKAGE_SELF_TEST=PASS')) {
              throw 'Meryl Phase2 packaged CMD self-test did not report PASS.'
          }

          # Paimon package revision: self-contained-v2
          $paimonCmd = 'ai-voice/phase2/06_paimon_phase2_flac.cmd'
          $paimonPs1 = 'ai-voice/phase2/paimon_phase2_flac_v1.ps1'
          $paimonHelper = 'ai-voice/phase2/paimon_phase2_migrate_v1.py'
          $paimonZip = 'ai-voice/phase2/Phase2_Paimon_FLAC.zip'

          $paimonCmdBytes = [IO.File]::ReadAllBytes($paimonCmd)
          if (@($paimonCmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Paimon Phase2 CMD must remain ASCII-only.'
          }

          $paimonPs1Bytes = [IO.File]::ReadAllBytes($paimonPs1)
          if ($paimonPs1Bytes.Length -lt 3 -or
              $paimonPs1Bytes[0] -ne 0xEF -or
              $paimonPs1Bytes[1] -ne 0xBB -or
              $paimonPs1Bytes[2] -ne 0xBF) {
              throw 'Paimon Phase2 PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $paimonTokens = $null
          $paimonErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $paimonPs1),
              [ref]$paimonTokens,
              [ref]$paimonErrors
          )
          if (@($paimonErrors).Count -ne 0) {
              throw ('Paimon Phase2 PowerShell parse failed: ' + $paimonErrors[0].Message)
          }

          python -m py_compile $paimonHelper
          if ($LASTEXITCODE -ne 0) {
              throw ('Paimon Phase2 helper compile failed with exit code ' + $LASTEXITCODE)
          }
          $paimonHelperTest = @(& python $paimonHelper --self-test 2>&1)
          if ($LASTEXITCODE -ne 0 -or (@($paimonHelperTest | ForEach-Object { [string]$_ }) -notcontains 'PAIMON_PHASE2_SELF_TEST=PASS')) {
              throw ('Paimon Phase2 helper self-test failed: ' + ((@($paimonHelperTest | ForEach-Object { [string]$_ })) -join ' / '))
          }

          $paimonDiagRoot = Join-Path $env:RUNNER_TEMP 'paimon-missing-root'
          Remove-Item -LiteralPath $paimonDiagRoot -Recurse -Force -ErrorAction SilentlyContinue
          $paimonDiag = @(& python $paimonHelper --preflight-only --root $paimonDiagRoot --tool-root $paimonDiagRoot 2>&1)
          $paimonDiagExit = $LASTEXITCODE
          $paimonDiagText = (@($paimonDiag | ForEach-Object { [string]$_ }) -join [Environment]::NewLine)
          if ($paimonDiagExit -eq 0) {
              throw 'Paimon preflight diagnostic unexpectedly succeeded for a missing root.'
          }
          if (-not $paimonDiagText.Contains('PAIMON_PREFLIGHT={"status":"STOPPED"')) {
              throw ('Paimon preflight diagnostic did not return structured STOPPED output: ' + $paimonDiagText)
          }
          if ($paimonDiagText.Contains('Traceback (most recent call last):')) {
              throw 'Paimon preflight diagnostic leaked a Python traceback.'
          }

          $paimonText = [IO.File]::ReadAllText($paimonPs1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'param([switch]$PackageSelfTest)',
              '$PSScriptRoot',
              'paimon_phase2_migrate_v1.py',
              'wavCount -ne 84 -or $flacCount -ne 0',
              'wslpath -a -u $helperWin',
              'Migration committed:',
              'PHASE2_PAIMON=MIGRATED_VERIFICATION_FAILED',
              'PHASE2_PAIMON=SUCCESS'
          )) {
              if (-not $paimonText.Contains($required)) {
                  throw ('Paimon Phase2 guard is missing: ' + $required)
              }
          }
          if ($paimonText.Contains('Invoke-WebRequest') -or
              $paimonText.Contains('raw.githubusercontent.com') -or
              $paimonText.Contains('StandardInput')) {
              throw 'Paimon Phase2 PS1 must not use runtime download or stdin helper transport.'
          }

          $paimonHelperText = [IO.File]::ReadAllText($paimonHelper, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'EXPECTED_WAV_COUNT = 84',
              'EXPECTED_STANDARD_REF_COUNT = 23',
              'EXPECTED_EMOTION_CACHE_COUNT = 84',
              'EXPECTED_COMPARISON_REF_COUNT = 14',
              '"shared_results/paimon.json": 84',
              '"shared_results/paimon_selection.json": 16',
              '"shared_results/paimon_emotion_pools.json": 37',
              'IGNORED_TOOL_JSON_NAMES',
              'IGNORED_TOOL_DIR_PREFIXES',
              '"angry.json": 11',
              '"cheerful.json": 14',
              '"gentle.json": 8',
              '"surprised.json": 14',
              '"worried.json": 11',
              'paimon_emotion_pools.json',
              'PAIMON_PHASE2_SELF_TEST=PASS'
          )) {
              if (-not $paimonHelperText.Contains($required)) {
                  throw ('Paimon Phase2 helper guard is missing: ' + $required)
              }
          }

          $paimonZipHandle = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $paimonZip))
          try {
              $entryNames = @($paimonZipHandle.Entries | ForEach-Object { $_.FullName } | Sort-Object)
              $expectedNames = @(
                  '06_paimon_phase2_flac.cmd',
                  'paimon_phase2_flac_v1.ps1',
                  'paimon_phase2_migrate_v1.py'
              ) | Sort-Object
              if ($entryNames.Count -ne $expectedNames.Count) {
                  throw 'Paimon Phase2 ZIP entry count is invalid.'
              }
              for ($index = 0; $index -lt $expectedNames.Count; $index++) {
                  if ($entryNames[$index] -cne $expectedNames[$index]) {
                      throw ('Paimon Phase2 ZIP entry mismatch: ' + $entryNames[$index])
                  }
              }
          }
          finally {
              $paimonZipHandle.Dispose()
          }

          $paimonExtractRoot = Join-Path $env:RUNNER_TEMP 'paimon-phase2-package'
          Remove-Item -LiteralPath $paimonExtractRoot -Recurse -Force -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $paimonZip), $paimonExtractRoot)

          $env:PAIMON_PHASE2_PACKAGE_SELF_TEST = '1'
          try {
              & (Join-Path $paimonExtractRoot '06_paimon_phase2_flac.cmd')
              if ($LASTEXITCODE -ne 0) {
                  throw ('Paimon Phase2 packaged CMD self-test failed with exit code ' + $LASTEXITCODE)
              }
          }
          finally {
              Remove-Item Env:PAIMON_PHASE2_PACKAGE_SELF_TEST -ErrorAction SilentlyContinue
          }

          $paimonPackageLog = Join-Path $env:TEMP 'rensei_paimon_phase2_flac_log.txt'
          if (-not (Test-Path -LiteralPath $paimonPackageLog -PathType Leaf)) {
              throw 'Paimon Phase2 packaged CMD self-test did not create its log.'
          }
          $paimonPackageLogText = [IO.File]::ReadAllText($paimonPackageLog, [Text.Encoding]::UTF8)
          if (-not $paimonPackageLogText.Contains('PAIMON_PHASE2_PACKAGE_SELF_TEST=PASS')) {
              throw 'Paimon Phase2 packaged CMD self-test did not report PASS.'
          }

          $requiemCmd = 'ai-voice/phase2/07_requiem_phase2_flac.cmd'
          $requiemPs1 = 'ai-voice/phase2/requiem_phase2_flac_v1.ps1'
          $requiemHelper = 'ai-voice/phase2/requiem_phase2_migrate_v1.py'
          $requiemZip = 'ai-voice/phase2/Phase2_Requiem_FLAC.zip'

          $requiemCmdBytes = [IO.File]::ReadAllBytes($requiemCmd)
          if (@($requiemCmdBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw 'Requiem Phase2 CMD must remain ASCII-only.'
          }

          $requiemPs1Bytes = [IO.File]::ReadAllBytes($requiemPs1)
          if ($requiemPs1Bytes.Length -lt 3 -or
              $requiemPs1Bytes[0] -ne 0xEF -or
              $requiemPs1Bytes[1] -ne 0xBB -or
              $requiemPs1Bytes[2] -ne 0xBF) {
              throw 'Requiem Phase2 PS1 with non-ASCII text must remain UTF-8 BOM.'
          }

          $requiemTokens = $null
          $requiemErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $requiemPs1),
              [ref]$requiemTokens,
              [ref]$requiemErrors
          )
          if (@($requiemErrors).Count -ne 0) {
              throw ('Requiem Phase2 PowerShell parse failed: ' + $requiemErrors[0].Message)
          }

          python -m py_compile $requiemHelper
          if ($LASTEXITCODE -ne 0) {
              throw ('Requiem Phase2 helper compile failed with exit code ' + $LASTEXITCODE)
          }
          $requiemHelperTest = @(& python $requiemHelper --self-test 2>&1)
          if ($LASTEXITCODE -ne 0 -or (@($requiemHelperTest | ForEach-Object { [string]$_ }) -notcontains 'REQUIEM_PHASE2_SELF_TEST=PASS')) {
              throw ('Requiem Phase2 helper self-test failed: ' + ((@($requiemHelperTest | ForEach-Object { [string]$_ })) -join ' / '))
          }

          $requiemDiagRoot = Join-Path $env:RUNNER_TEMP 'requiem-missing-root'
          Remove-Item -LiteralPath $requiemDiagRoot -Recurse -Force -ErrorAction SilentlyContinue
          $requiemDiag = @(& python $requiemHelper --preflight-only --root $requiemDiagRoot --tool-root $requiemDiagRoot 2>&1)
          $requiemDiagExit = $LASTEXITCODE
          $requiemDiagText = (@($requiemDiag | ForEach-Object { [string]$_ }) -join [Environment]::NewLine)
          if ($requiemDiagExit -eq 0) {
              throw 'Requiem preflight diagnostic unexpectedly succeeded for a missing root.'
          }
          if (-not $requiemDiagText.Contains('REQUIEM_PREFLIGHT={"status":"STOPPED"')) {
              throw ('Requiem preflight diagnostic did not return structured STOPPED output: ' + $requiemDiagText)
          }
          if ($requiemDiagText.Contains('Traceback (most recent call last):')) {
              throw 'Requiem preflight diagnostic leaked a Python traceback.'
          }

          $requiemText = [IO.File]::ReadAllText($requiemPs1, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'param([switch]$PackageSelfTest)',
              '$PSScriptRoot',
              'requiem_phase2_migrate_v1.py',
              'wavCount -ne 137 -or $flacCount -ne 0',
              'wslpath -a -u $helperWin',
              'Migration committed:',
              'PHASE2_REQUIEM=MIGRATED_VERIFICATION_FAILED',
              'PHASE2_REQUIEM=SUCCESS'
          )) {
              if (-not $requiemText.Contains($required)) {
                  throw ('Requiem Phase2 guard is missing: ' + $required)
              }
          }
          if ($requiemText.Contains('Invoke-WebRequest') -or
              $requiemText.Contains('raw.githubusercontent.com') -or
              $requiemText.Contains('StandardInput')) {
              throw 'Requiem Phase2 PS1 must not use runtime download or stdin helper transport.'
          }

          $requiemHelperText = [IO.File]::ReadAllText($requiemHelper, [Text.Encoding]::UTF8)
          foreach ($required in @(
              'EXPECTED_WAV_COUNT = 137',
              'EXPECTED_STANDARD_REF_COUNT = 16',
              'EXPECTED_EMOTION_CACHE_COUNT = 18',
              'EXPECTED_TOOL_PLAN_DISTINCT_WAVS = 16',
              '"cheerful.json": 5',
              '"cheerful_30秒.json": 5',
              '"gentle.json": 9',
              '音声一覧.before_nte_dialogue_20260928.json',
              'shared_results',
              'emotion_pools',
              'REQUIEM_PREFLIGHT=',
              'REQUIEM_MIGRATION_ERROR=',
              'REQUIEM_PHASE2_SELF_TEST=PASS'
          )) {
              if (-not $requiemHelperText.Contains($required)) {
                  throw ('Requiem Phase2 helper guard is missing: ' + $required)
              }
          }

          $requiemZipHandle = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $requiemZip))
          try {
              $entryNames = @($requiemZipHandle.Entries | ForEach-Object { $_.FullName } | Sort-Object)
              $expectedNames = @(
                  '07_requiem_phase2_flac.cmd',
                  'requiem_phase2_flac_v1.ps1',
                  'requiem_phase2_migrate_v1.py'
              ) | Sort-Object
              if ($entryNames.Count -ne $expectedNames.Count) {
                  throw 'Requiem Phase2 ZIP entry count is invalid.'
              }
              for ($index = 0; $index -lt $expectedNames.Count; $index++) {
                  if ($entryNames[$index] -cne $expectedNames[$index]) {
                      throw ('Requiem Phase2 ZIP entry mismatch: ' + $entryNames[$index])
                  }
              }
          }
          finally {
              $requiemZipHandle.Dispose()
          }

          $requiemExtractRoot = Join-Path $env:RUNNER_TEMP 'requiem-phase2-package'
          Remove-Item -LiteralPath $requiemExtractRoot -Recurse -Force -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $requiemZip), $requiemExtractRoot)

          $env:REQUIEM_PHASE2_PACKAGE_SELF_TEST = '1'
          try {
              & (Join-Path $requiemExtractRoot '07_requiem_phase2_flac.cmd')
              if ($LASTEXITCODE -ne 0) {
                  throw ('Requiem Phase2 packaged CMD self-test failed with exit code ' + $LASTEXITCODE)
              }
          }
          finally {
              Remove-Item Env:REQUIEM_PHASE2_PACKAGE_SELF_TEST -ErrorAction SilentlyContinue
          }

          $requiemPackageLog = Join-Path $env:TEMP 'rensei_requiem_phase2_flac_log.txt'
          if (-not (Test-Path -LiteralPath $requiemPackageLog -PathType Leaf)) {
              throw 'Requiem Phase2 packaged CMD self-test did not create its log.'
          }
          $requiemPackageLogText = [IO.File]::ReadAllText($requiemPackageLog, [Text.Encoding]::UTF8)
          if (-not $requiemPackageLogText.Contains('REQUIEM_PHASE2_PACKAGE_SELF_TEST=PASS')) {
              throw 'Requiem Phase2 packaged CMD self-test did not report PASS.'
          }

          $updater = [IO.File]::ReadAllText($updaterPath, [Text.Encoding]::UTF8)
          foreach ($required in @(
              '[switch]$RepairButton',
              '[switch]$ForceUpdate',
              '[string]$ToolRoot',
              'UPDATE_BUTTON_REPAIR=SUCCESS',
              'api.github.com/repos/rensei11/00-tools/contents/ai-voice/update-index.json?ref=main',
              'REPLACE_BEGIN relative=',
              'REPLACE_ERROR relative='
          )) {
              if (-not $updater.Contains($required)) {
                  throw ('public updater is missing: ' + $required)
              }
          }
          if ($updater.Contains('raw.githubusercontent.com/rensei11/05-AI-voice/')) {
              throw 'public updater contains a private raw URL.'
          }

          $sandbox = Join-Path $env:RUNNER_TEMP 'ai-voice-repair-test'
          New-Item -ItemType Directory -Path $sandbox -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $sandbox 'app.py') -Value 'APP_VERSION = "test"' -Encoding ASCII
          $appHashBefore = (Get-FileHash -LiteralPath (Join-Path $sandbox 'app.py') -Algorithm SHA256).Hash

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $updaterPath -RepairButton -ToolRoot $sandbox
          if ($LASTEXITCODE -ne 0) {
              throw ('repair mode failed with exit code ' + $LASTEXITCODE)
          }

          $installedPath = Join-Path $sandbox 'update_and_start.ps1'
          if (-not (Test-Path -LiteralPath $installedPath -PathType Leaf)) {
              throw 'repair mode did not create update_and_start.ps1.'
          }
          $installed = [IO.File]::ReadAllText($installedPath, [Text.Encoding]::UTF8)
          if (-not $installed.Contains('raw.githubusercontent.com/rensei11/00-tools/main/ai-voice/bootstrap/v1/migrate_updater_bootstrap_v1.ps1')) {
              throw 'installed update button does not use the public updater.'
          }
          if ($installed.Contains('raw.githubusercontent.com/rensei11/05-AI-voice/')) {
              throw 'installed update button contains a private raw URL.'
          }

          $appHashAfter = (Get-FileHash -LiteralPath (Join-Path $sandbox 'app.py') -Algorithm SHA256).Hash
          if ($appHashAfter -ne $appHashBefore) {
              throw 'repair mode modified app.py.'
          }
